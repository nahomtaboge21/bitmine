# ────────────────────────────────────────────────────────────────────────────
#  Nginx reverse proxy for KeyHunt Web UI
#
#  Install:
#    apt install -y nginx
#    cp nginx/keyhunt.conf /etc/nginx/sites-available/keyhunt
#    ln -s /etc/nginx/sites-available/keyhunt /etc/nginx/sites-enabled/
#    nginx -t && systemctl reload nginx
#    ufw allow 80/tcp
#
#  After install, open:  http://YOUR_SERVER_IP
# ────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;          # Replace _ with your domain if you have one

    # ── WebSocket + HTTP proxy to Node ──────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout  86400s;   # keep WebSocket alive
        proxy_send_timeout  86400s;
    }

    # ── Serve log files directly (optional, comment out if not needed) ───────
    location /logs/ {
        alias /opt/keyhunt/frontend/logs/;
        autoindex on;
        auth_basic           "KeyHunt Logs";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }
}
